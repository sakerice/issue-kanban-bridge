name: Validate release source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/issue-kanban-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/issue-kanban-bridge/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
